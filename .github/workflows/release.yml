name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    # glibc 2.35 (Ubuntu 22.04): building on a newer image would produce a
    # binary that older clients cannot run.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            wget \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            libwebkit2gtk-4.1-dev \
            javascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri/crates/app
          tagName: ${{ github.ref_name }}
          releaseName: "ATCS Soundboard ${{ github.ref_name }}"
          releaseBody: |
            ## ATCS Soundboard ${{ github.ref_name }}

            Linux (PipeWire) build. Download the AppImage for a portable test
            or the .deb for a system install.
          releaseDraft: true
          prerelease: false
